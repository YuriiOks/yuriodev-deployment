# Production. frontend/backend run the :production images that the release
# workflow promotes; the deploy agent pulls them. `build:` stays only for
# break-glass on-box builds (pause the agent first: ~/.yuriodev-deploy-paused).
services:
  frontend:
    image: ghcr.io/yuriioks/yuriodev-frontend:production
    build:
      context: ./frontend
      target: runtime
    container_name: yuriodev-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/yuriioks/yuriodev-backend:production
    build:
      context: ./backend
      target: runtime
    container_name: yuriodev-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:                             # public config first, then optional secrets
      - path: ./env/prod.env
        required: true
      - path: ./env/prod.secrets.env      # gitignored
        required: false

  proxy:
    image: nginx:stable-alpine
    container_name: yuriodev-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

networks:
  default:
    name: yuriodev-network