# Production. frontend/backend run the :production images that the release
# workflow promotes; the deploy agent pulls them. `build:` stays only for
# break-glass on-box builds (pause the agent first: ~/.yuriodev-deploy-paused).
services:
  frontend:
    image: ghcr.io/yuriioks/yuriodev-frontend:production
    build:
      context: ./frontend
      target: runtime
    container_name: yuriodev-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/yuriioks/yuriodev-backend:production
    build:
      context: ./backend
      target: runtime
    container_name: yuriodev-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:                             # public config first, then optional secrets
      - path: ./env/prod.env
        required: true
      - path: ./env/prod.secrets.env      # gitignored
        required: false

  proxy:
    # Pinned by digest: Dependabot's docker-compose entry proposes new digests and the
    # proxy-image.yml workflow scans this exact image. The deploy agent ignores non-ghcr.io
    # images, so a new pin goes live only by hand (deploy/README.md, "The proxy image").
    image: nginx:stable-alpine@sha256:985220252f3863977e468f611ef118ebd01421289dd86ee1ae99cb068c3bce2b
    container_name: yuriodev-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy:/etc/nginx/conf.d:ro          # nginx never writes here; edit on the host, then reload
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:                              # no memory limit on purpose: it serves every environment
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: yuriodev-network