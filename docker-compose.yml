# Production. frontend/backend run the :production images that the release
# workflow promotes; the deploy agent pulls them. `build:` stays only for
# break-glass on-box builds (pause the agent first: ~/.yuriodev-deploy-paused).
services:
  frontend:
    image: ghcr.io/yuriioks/yuriodev-frontend:production
    build:
      context: ./frontend
      target: runtime
    container_name: yuriodev-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/yuriioks/yuriodev-backend:production
    build:
      context: ./backend
      target: runtime
    container_name: yuriodev-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:                             # public config first, then optional secrets
      - path: ./env/prod.env
        required: true
      - path: ./env/prod.secrets.env      # gitignored
        required: false

  proxy:
    # Pinned by digest: Dependabot's docker-compose entry proposes new digests and the
    # proxy-image.yml workflow scans this exact image. The deploy agent ignores non-ghcr.io
    # images, so a new pin goes live only by hand (deploy/README.md, "The proxy image").
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    container_name: yuriodev-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy:/etc/nginx/conf.d:ro          # nginx never writes here; edit on the host, then reload
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:                              # no memory limit on purpose: it serves every environment
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Dashboards database of production: defined, not started yet (deploy/README.md, "Dashboards database").
  postgres:
    image: postgres:18.6-alpine3.24@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    container_name: yuriodev-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:                          # non-secret; POSTGRES_PASSWORD comes from the secrets file
      POSTGRES_USER: dashboards
      POSTGRES_DB: dashboards
    env_file:
      - path: ./env/prod.secrets.env   # gitignored
        required: false
    volumes:
      - yuriodev-postgres-data:/var/lib/postgresql          # postgres 18 keeps PGDATA in a versioned subdirectory
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dashboards", "-d", "dashboards"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  yuriodev-postgres-data:
    name: yuriodev-postgres-data

networks:
  default:
    name: yuriodev-network