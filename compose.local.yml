# Local development on the Mac (Docker Desktop / OrbStack). Never run on the VPS.
#   make dev-up    -> frontend http://localhost:5173 (Vite HMR), backend http://localhost:8000 (uvicorn --reload)
# Builds the Dockerfiles' `dev` stages; the deployed environments run the `runtime`
# stage, built once in CI. Own project and network: nothing here can reach dev/stage/prod.
name: yuriodev-local

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000   # Vite dev-server proxy for /api (not baked into any build)
    volumes:
      - ./frontend:/app
      - /app/node_modules                           # keep the container's Linux node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ./env/local.env
        required: true
      - path: ./env/local.secrets.env
        required: false
    volumes:
      - ./backend:/app                              # src/ + tests/ with hot reload

networks:
  default:
    name: yuriodev-local
