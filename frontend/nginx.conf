server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    # Requests arrive through the proxy and Cloudflare.
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/manifest+json;

    # Security headers are set only by the proxy, never here, so nothing is
    # duplicated. Each location below sets its own Cache-Control: add_header in
    # a location replaces (does not extend) the server-level list.

    # Vite's content-hashed build output: cache for a year. A missing file is a
    # real 404 rather than the SPA shell.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
    }

    # The SPA shell (also the fallback target for client-side routes) and every
    # other non-hashed file: always revalidate, so a release shows at once.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
