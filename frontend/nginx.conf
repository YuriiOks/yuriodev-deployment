server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    # Requests arrive through the proxy and Cloudflare.
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml text/xml application/xml application/manifest+json;

    # Security headers are set only by the proxy, never here, so nothing is
    # duplicated. Each location below sets its own Cache-Control: add_header in
    # a location replaces (does not extend) the server-level list.

    # Vite's content-hashed build output: cache for a year. A missing file is a
    # real 404 rather than the SPA shell. No `always` here: a 404 must not be
    # cached for a year (a rollback would bring the old file names back).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pre-paint theme script: not content-hashed, so always revalidate. A
    # missing file is a real 404, never the HTML shell served as JavaScript.
    location = /theme-init.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
    }

    # Top-level static files (icons, robots.txt, sitemap.xml, ...): a missing
    # one is a real 404, not the SPA shell with a 200.
    location ~ ^/[^/]+\.(?:ico|png|svg|jpe?g|webp|gif|txt|xml)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The SPA shell (also the fallback target for client-side routes) and every
    # other non-hashed file: always revalidate, so a release shows at once.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
