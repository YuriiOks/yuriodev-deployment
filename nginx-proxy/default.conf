# Upstream for the frontend React app container
upstream frontend {
    server frontend:80;
}

# Upstream for the backend FastAPI container
upstream backend {
    server backend:8000;
}

# Server block for yuriodev.co.uk (FRONTEND + API PROXY)
server {
    listen 443 ssl;
    http2 on;
    server_name yuriodev.co.uk www.yuriodev.co.uk;

    ssl_certificate /etc/nginx/conf.d/certs/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- NEW BLOCK TO HANDLE API REQUESTS ---
    location /api/ {
        # CORS Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://yuriodev.co.uk';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type';
            return 204;
        }
        
        add_header 'Access-Control-Allow-Origin' 'https://yuriodev.co.uk' always;

        # Forward to the backend container
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # --- END OF NEW BLOCK ---

    # Catch-all for all other requests (serves the React app)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# We can now REMOVE the server block for api.yuriodev.co.uk
# as the main domain's config is handling everything.

# HTTP to HTTPS redirects
server {
    listen 80;
    server_name yuriodev.co.uk www.yuriodev.co.uk api.yuriodev.co.uk;
    return 301 https://$host$request_uri;
}