# Upstreams are resolved per request through Docker's embedded DNS, so a
# recreated container (new IP) needs no reload, and a stopped container only
# fails its own location instead of stopping nginx from loading its config.
# Address containers by container_name: service names can repeat across
# compose projects on the shared network.
resolver 127.0.0.11 valid=10s ipv6=off;

# yuriodev.co.uk (production)
server {
    listen 443 ssl;
    http2 on;
    server_name yuriodev.co.uk www.yuriodev.co.uk;

    ssl_certificate /etc/nginx/conf.d/certs/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    set $prod_frontend http://yuriodev-frontend:80;
    set $prod_backend  http://yuriodev-backend:8000;

    # Backend API (same origin as the frontend, so no CORS headers)
    location /api/ {
        proxy_pass $prod_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: the React app
    location / {
        proxy_pass $prod_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP to HTTPS redirects
server {
    listen 80;
    server_name yuriodev.co.uk www.yuriodev.co.uk api.yuriodev.co.uk;
    return 301 https://$host$request_uri;
}
