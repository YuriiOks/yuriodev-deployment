# Upstreams are resolved per request through Docker's embedded DNS, so a
# recreated container (new IP) needs no reload, and a stopped container only
# fails its own location instead of stopping nginx from loading its config.
# Address containers by container_name: service names can repeat across
# compose projects on the shared network.
resolver 127.0.0.11 valid=10s ipv6=off;

# Load order (conf.d/*.conf, alphabetical): 00-http.conf (server_tokens, log
# format, zones), 10-catchall.conf (default servers: unknown SNI/Host get nothing,
# :80 /healthz), then the vhosts. Shared pieces live in snippets/, which the glob
# does not load.

# yuriodev.co.uk (production)
server {
    listen 443 ssl;
    http2 on;
    server_name yuriodev.co.uk;

    ssl_certificate /etc/nginx/conf.d/certs/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Access log, body limit, security headers. A location that adds its own
    # add_header must include snippets/security-headers.conf again.
    include /etc/nginx/conf.d/snippets/server-common.conf;

    set $prod_frontend http://yuriodev-frontend:80;
    set $prod_backend  http://yuriodev-backend:8000;

    # Backend API (same origin as the frontend, so no CORS headers)
    location /api/ {
        include /etc/nginx/conf.d/snippets/proxy-common.conf;
        proxy_pass $prod_backend;
    }

    # Everything else: the React app
    location / {
        include /etc/nginx/conf.d/snippets/proxy-common.conf;
        proxy_pass $prod_frontend;
    }
}

# www -> apex: one canonical hostname (the wildcard origin cert already covers www)
server {
    listen 443 ssl;
    http2 on;
    server_name www.yuriodev.co.uk;

    ssl_certificate /etc/nginx/conf.d/certs/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/conf.d/snippets/server-common.conf;
    return 301 https://yuriodev.co.uk$request_uri;
}

# HTTP -> HTTPS for our own hostnames only. Cloudflare "Full" connects over :80
# when a visitor uses http:// and Always Use HTTPS is off. Unknown hosts and the
# proxy's /healthz: 10-catchall.conf.
server {
    listen 80;
    server_name yuriodev.co.uk www.yuriodev.co.uk dev.yuriodev.co.uk stage.yuriodev.co.uk;

    access_log /var/log/nginx/access.log edge_json;

    location / {
        return 301 https://$host$request_uri;
    }
}
