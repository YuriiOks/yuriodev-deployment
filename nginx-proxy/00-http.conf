# http-level settings shared by every vhost. conf.d/*.conf loads in alphabetical
# order, so this file comes first and the log format and rate-limit zones exist
# before any server block refers to them.
# Never put add_header here: dev.conf and stage.conf set their own add_header at
# server level, and a level that defines any add_header inherits none from above.
# Never put access_log here either: the stock nginx.conf already logs at http level
# (format "main"), and a second http-level access_log would write every line twice.
# Each server block sets its own access_log instead (snippets/server-common.conf).

server_tokens off;

# Visitor address (set_real_ip_from Cloudflare's ranges + real_ip_header
# CF-Connecting-IP) is not configured yet: it needs every origin connection to
# arrive over IPv4 first (no AAAA record for the origin). Until then $remote_addr
# is the Cloudflare edge address, and the "ip" log field shows Cloudflare's /24.

# Minimised addresses for the access log: /24 for IPv4, /48 for full-form IPv6.
map $remote_addr $log_ip {
    "~^(?P<net>\d+\.\d+\.\d+)\.\d+$"                                  $net.0;
    "~^(?P<net>[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}):" $net::;
    default                                                           other;
}
# The TCP peer before real_ip (the same as $remote_addr until real_ip is on).
# "172.18.0.0" here means the request came in over IPv6 via docker-proxy.
map $realip_remote_addr $log_peer {
    "~^(?P<net>\d+\.\d+\.\d+)\.\d+$"                                  $net.0;
    "~^(?P<net>[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}):" $net::;
    default                                                           other;
}

# One JSON line per request. No query strings ($uri, not $request_uri), no full IPs,
# no X-Forwarded-For (that column is what put full visitor IPs in the stock log).
log_format edge_json escape=json
    '{"time":"$time_iso8601","host":"$host","ip":"$log_ip","peer":"$log_peer",'
    '"country":"$http_cf_ipcountry","ray":"$http_cf_ray","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
    '"upstream_rt":"$upstream_response_time","ua":"$http_user_agent","user":"$remote_user"}';

# Per-visitor rate-limit zones. Inert until a location says limit_req, which waits
# for the real client address above (otherwise every visitor behind one Cloudflare
# edge node would share a bucket).
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=reports:1m rate=30r/m;
limit_req_status 429;
limit_req_log_level warn;
