# Included in every proxied location, next to its `proxy_pass $variable;`.
# X-Forwarded-For REPLACES rather than appends: a client-supplied (spoofable)
# X-Forwarded-For is never passed on. $remote_addr is the Cloudflare edge address
# until real_ip is configured in 00-http.conf, then the verified visitor.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
