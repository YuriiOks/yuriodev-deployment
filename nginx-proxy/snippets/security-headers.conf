# Security response headers for every :443 server block (not auto-loaded: this
# directory does not match the conf.d/*.conf glob).
# nginx rule: a block with ANY add_header of its own inherits NONE from its parent.
# So include this file at server level, next to any other server-level add_header,
# and include it AGAIN inside any location that ever adds its own header.
# Every header uses `always`, so 401/404/429/5xx responses carry it too.
# Only the proxy sets these headers; no Cloudflare setting or Transform Rule may
# duplicate them.

# One day while the rollout is new; raise to 180 days once the CSP is enforced,
# and to a year with includeSubDomains only after every subdomain is HTTPS-only.
# Never preload.
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Report-Only: violations show in the browser console, nothing is blocked, and
# there is no report endpoint yet. It allows exactly what the current bundle loads:
# the one same-origin module script and stylesheet, the Google Fonts stylesheet
# (@import in global.css) and its font files, same-origin fetches, and data:
# images (Vite inlines small imported images as data: URIs). Drop the two Google
# hosts once the font is self-hosted; rename to Content-Security-Policy to enforce.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
