# Included once at server level in every :443 vhost: one minimised JSON access
# log (format in 00-http.conf), an explicit body limit (no upload routes exist),
# and the security headers.
access_log /var/log/nginx/access.log edge_json;
client_max_body_size 1m;
include /etc/nginx/conf.d/snippets/security-headers.conf;
