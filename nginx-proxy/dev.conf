# dev.yuriodev.co.uk: the dev compose project (deploy/dev/compose.yml),
# behind basic auth and never indexed or cached. Uses the per-request resolver
# declared in default.conf (one http context; declaring it twice is an error).
server {
    listen 443 ssl;
    http2 on;
    server_name dev.yuriodev.co.uk;

    ssl_certificate /etc/nginx/conf.d/certs/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "yuriodev dev";
    auth_basic_user_file /etc/nginx/conf.d/auth/envs.htpasswd;

    # Same level as the include below, so all of these headers are sent together.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    # Drop any Cache-Control the frontend or backend sends (inherited by both
    # locations, which set no proxy_hide_header of their own), so dev/stage send
    # exactly one Cache-Control: the no-store above.
    proxy_hide_header Cache-Control;
    include /etc/nginx/conf.d/snippets/server-common.conf;

    set $dev_frontend http://yuriodev-dev-frontend:80;
    set $dev_backend  http://yuriodev-dev-backend:8000;

    location /api/ {
        include /etc/nginx/conf.d/snippets/proxy-common.conf;
        proxy_pass $dev_backend;
    }

    location / {
        include /etc/nginx/conf.d/snippets/proxy-common.conf;
        proxy_pass $dev_frontend;
    }
}
