# Default servers: anything that is not one of our hostnames gets nothing.
#
# :443 - no SNI or an unknown SNI (IP scans, api., random names): the TLS handshake
#        is aborted and no certificate is shown. A known SNI with an unknown Host
#        header (e.g. SNI yuriodev.co.uk, Host example.com): the connection is
#        closed without a response (444).
#        The TLS options include stays: OpenSSL keeps the default server's SSL
#        context as the session cache for every handshake on this port, whichever
#        vhost SNI picks afterwards, so without ssl_session_cache here no site
#        could resume a TLS session. (Ciphers and protocols follow the SNI vhost.)
#        http2 on: without it, an HTTP/2 request whose Host picks this server gets
#        a 421 error page instead of the silent 444.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_reject_handshake on;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/access.log edge_json;
    return 444;
}

# :80 - the proxy's own HEALTHCHECK (wget http://127.0.0.1/healthz, Host 127.0.0.1)
# lands here because 127.0.0.1 matches no server_name, so /healthz must stay in
# this server. Every other unknown host is closed. Known hosts redirect to https
# (the :80 server in default.conf).
server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log edge_json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}
