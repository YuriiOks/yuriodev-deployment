# stage.yuriodev.co.uk: the stage compose project (deploy/stage/compose.yml),
# same basic auth as dev, never indexed or cached. Uses the per-request
# resolver declared in default.conf.
server {
    listen 443 ssl;
    http2 on;
    server_name stage.yuriodev.co.uk;

    ssl_certificate /etc/nginx/conf.d/certs/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "yuriodev stage";
    auth_basic_user_file /etc/nginx/conf.d/auth/envs.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    set $stage_frontend http://yuriodev-stage-frontend:80;
    set $stage_backend  http://yuriodev-stage-backend:8000;

    location /api/ {
        proxy_pass $stage_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $stage_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
