# stage.yuriodev.co.uk: the stage compose project (deploy/stage/compose.yml),
# same basic auth as dev, never indexed or cached. Uses the per-request
# resolver declared in default.conf.
server {
    listen 443 ssl;
    http2 on;
    server_name stage.yuriodev.co.uk;

    ssl_certificate /etc/nginx/conf.d/certs/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "yuriodev stage";
    auth_basic_user_file /etc/nginx/conf.d/auth/envs.htpasswd;

    # Same level as the include below, so all of these headers are sent together.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/conf.d/snippets/server-common.conf;

    set $stage_frontend http://yuriodev-stage-frontend:80;
    set $stage_backend  http://yuriodev-stage-backend:8000;

    location /api/ {
        include /etc/nginx/conf.d/snippets/proxy-common.conf;
        proxy_pass $stage_backend;
    }

    location / {
        # Drop the app's own Cache-Control (if the image sends one), so dev/stage
        # send exactly one Cache-Control: the server-level no-store above.
        proxy_hide_header Cache-Control;
        include /etc/nginx/conf.d/snippets/proxy-common.conf;
        proxy_pass $stage_frontend;
    }
}
