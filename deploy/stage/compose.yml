# stage.yuriodev.co.uk: runs the :stage images, moved by .github/workflows/images.yml to
# the newest built master head (an optional vX.Y.Z-rc.N tag, promote-stage.yml, pins an
# older master commit until the next master build). Releases are tagged on what runs here.
# Service names are environment-unique on purpose (see deploy/dev/compose.yml).
#   docker compose -f deploy/stage/compose.yml ps
name: yuriodev-stage

services:
  frontend-stage:
    image: ghcr.io/yuriioks/yuriodev-frontend:stage
    container_name: yuriodev-stage-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 96M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend-stage:
    image: ghcr.io/yuriioks/yuriodev-backend:stage
    container_name: yuriodev-stage-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:                             # public config first, then optional secrets
      - path: ../../env/stage.env
        required: true
      - path: ../../env/stage.secrets.env   # gitignored
        required: false

  # Dashboards database of stage: defined, not started yet (deploy/README.md, "Dashboards database").
  postgres-stage:
    image: postgres:18.6-alpine3.24@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    container_name: yuriodev-stage-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:                          # non-secret; POSTGRES_PASSWORD comes from the secrets file
      POSTGRES_USER: dashboards
      POSTGRES_DB: dashboards
    env_file:
      - path: ../../env/stage.secrets.env   # gitignored
        required: false
    volumes:
      - yuriodev-stage-postgres-data:/var/lib/postgresql          # postgres 18 keeps PGDATA in a versioned subdirectory
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dashboards", "-d", "dashboards"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  yuriodev-stage-postgres-data:
    name: yuriodev-stage-postgres-data

networks:
  default:
    name: yuriodev-network
    external: true
