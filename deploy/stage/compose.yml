# stage.yuriodev.co.uk: runs the :stage images (moved by .github/workflows/promote-stage.yml
# on a vX.Y.Z-rc.N tag, or by images.yml while STAGE_AUTO_PROMOTE=true).
# Service names are environment-unique on purpose (see deploy/dev/compose.yml).
#   docker compose -f deploy/stage/compose.yml ps
name: yuriodev-stage

services:
  frontend-stage:
    image: ghcr.io/yuriioks/yuriodev-frontend:stage
    container_name: yuriodev-stage-frontend
    restart: unless-stopped

  backend-stage:
    image: ghcr.io/yuriioks/yuriodev-backend:stage
    container_name: yuriodev-stage-backend
    restart: unless-stopped
    env_file:                             # public config first, then optional secrets
      - path: ../../env/stage.env
        required: true
      - path: ../../env/stage.secrets.env   # gitignored
        required: false

networks:
  default:
    name: yuriodev-network
    external: true
