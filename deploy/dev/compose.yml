# dev.yuriodev.co.uk: runs the :dev images, moved by .github/workflows/images.yml to the
# newest built master head (like stage), or an explicit preview: a branch named dev/<name>
# (the last build to finish wins; /api/health "ref" names the branch) until the next master
# build. A preview swaps only the images: this file, env/dev.env and the proxy config always
# come from master on the box. `gh workflow run images.yml -f branch=<name>` (master too) puts
# a branch whose head already has scanned images on dev without rebuilding.
# Service names are unique per environment on purpose: the service name becomes
# a DNS alias on the shared network, and a second "frontend" would make Docker
# round-robin between environments. The proxy addresses container_name.
#   docker compose -f deploy/dev/compose.yml ps
name: yuriodev-dev

services:
  frontend-dev:
    image: ghcr.io/yuriioks/yuriodev-frontend:dev
    container_name: yuriodev-dev-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 96M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend-dev:
    image: ghcr.io/yuriioks/yuriodev-backend:dev
    container_name: yuriodev-dev-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:                             # public config first, then optional secrets
      - path: ../../env/dev.env
        required: true
      - path: ../../env/dev.secrets.env   # gitignored
        required: false

  # Dashboards database of dev. Reached only as yuriodev-dev-postgres:5432 on the shared network;
  # it publishes nothing. The deploy agent ignores it (not a ghcr.io image): start it by hand,
  # see deploy/README.md, "Dashboards database".
  postgres-dev:
    image: postgres:18.6-alpine3.24@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    container_name: yuriodev-dev-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:                          # non-secret; POSTGRES_PASSWORD comes from the secrets file
      POSTGRES_USER: dashboards
      POSTGRES_DB: dashboards
    env_file:
      - path: ../../env/dev.secrets.env   # gitignored
        required: false
    volumes:
      - yuriodev-dev-postgres-data:/var/lib/postgresql          # postgres 18 keeps PGDATA in a versioned subdirectory
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dashboards", "-d", "dashboards"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  yuriodev-dev-postgres-data:
    name: yuriodev-dev-postgres-data

networks:
  default:
    name: yuriodev-network
    external: true
