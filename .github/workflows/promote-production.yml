name: Promote to production

# A vX.Y.Z tag (after approval in the `production` environment) points
# :production at the images that stage is running now, fast-forwards the
# `production` branch, and records the digests in a GitHub Release.
# Only images that went through stage can reach production: both :stage
# digests must equal sha-<tagged commit>. Nothing is rebuilt.
# Repo variable PROD_DRY_RUN=true evaluates every gate but changes nothing.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.c.outputs.release }}
    steps:
      - id: c
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "release=true" >> "$GITHUB_OUTPUT"
          else echo "release=false" >> "$GITHUB_OUTPUT"; echo "$TAG is not a release tag; nothing to do here."; fi

  promote:
    needs: classify
    if: needs.classify.outputs.release == 'true'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write   # fast-forward `production`, create the Release
      packages: write   # retag :production
    env:
      SHA: ${{ github.sha }}
      TAG: ${{ github.ref_name }}
      DRY_RUN: ${{ vars.PROD_DRY_RUN == 'true' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must point at a commit on master
        run: |
          git merge-base --is-ancestor "$SHA" origin/master \
            || { echo "::error::$SHA is not on master"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Gate - stage must be running exactly these images
        id: gate
        run: |
          ref() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'; }
          # Stage follows master by itself (images.yml); give a just-merged commit up to ~15 min
          # to be built, scanned and put on stage before refusing.
          for i in $(seq 1 60); do
            ok=true
            for svc in frontend backend; do
              img="ghcr.io/yuriioks/yuriodev-$svc"
              want=$(ref "$img:sha-$SHA") || want=""
              stage=$(ref "$img:stage") || stage=""
              echo "$svc: sha-$SHA=${want:-none} stage=${stage:-none}"
              { [ -n "$want" ] && [ "$want" = "$stage" ]; } || ok=false
            done
            $ok && break
            sleep 15
          done
          for svc in frontend backend; do
            img="ghcr.io/yuriioks/yuriodev-$svc"
            want=$(ref "$img:sha-$SHA") || want=""
            stage=$(ref "$img:stage") || stage=""
            [ -n "$want" ] && [ "$want" = "$stage" ] \
              || { echo "::error::$svc on stage is not sha-$SHA (tag the master commit stage is running)"; exit 1; }
            echo "${svc}_digest=$want" >> "$GITHUB_OUTPUT"
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.DRY_RUN != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point :production at the stage digests
        if: env.DRY_RUN != 'true'
        env:
          FRONTEND: ${{ steps.gate.outputs.frontend_digest }}
          BACKEND: ${{ steps.gate.outputs.backend_digest }}
        run: |
          docker buildx imagetools create --prefer-index=false --tag ghcr.io/yuriioks/yuriodev-frontend:production "ghcr.io/yuriioks/yuriodev-frontend@$FRONTEND"
          docker buildx imagetools create --prefer-index=false --tag ghcr.io/yuriioks/yuriodev-backend:production "ghcr.io/yuriioks/yuriodev-backend@$BACKEND"
      - name: Fast-forward the production branch
        if: env.DRY_RUN != 'true'
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SHA:refs/heads/production"
      - name: Record the release (last-known-good log)
        if: env.DRY_RUN != 'true'
        env:
          FRONTEND: ${{ steps.gate.outputs.frontend_digest }}
          BACKEND: ${{ steps.gate.outputs.backend_digest }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "$(printf 'Production images (rollback: retag :production to these digests).\n\n- frontend: `ghcr.io/yuriioks/yuriodev-frontend@%s`\n- backend: `ghcr.io/yuriioks/yuriodev-backend@%s`\n- commit: %s\n' "$FRONTEND" "$BACKEND" "$SHA")"
      - name: Summary
        env:
          FRONTEND: ${{ steps.gate.outputs.frontend_digest }}
          BACKEND: ${{ steps.gate.outputs.backend_digest }}
        run: |
          { echo "### $TAG -> production (dry run: $DRY_RUN)"; echo "- frontend \`$FRONTEND\`"; echo "- backend \`$BACKEND\`"; } >> "$GITHUB_STEP_SUMMARY"
