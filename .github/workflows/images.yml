name: Images

# Build each image once per green master commit, push it as sha-<commit>,
# then point :dev at that exact digest. Promotions to :stage / :production
# only retag existing digests (see the promote workflows); nothing rebuilds.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  build-push:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend]
    env:
      IMAGE: ghcr.io/yuriioks/yuriodev-${{ matrix.service }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}:sha-<commit>
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:sha-${{ env.SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Point :dev at this digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:dev" "$IMAGE@$DIGEST"
          echo "### ${{ matrix.service }}: \`:dev\` -> \`$DIGEST\` (sha-$SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Also point :stage at it (only while STAGE_AUTO_PROMOTE=true)
        if: vars.STAGE_AUTO_PROMOTE == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:stage" "$IMAGE@$DIGEST"
          echo "### ${{ matrix.service }}: \`:stage\` -> \`$DIGEST\` (auto-promoted, sha-$SHA)" >> "$GITHUB_STEP_SUMMARY"
