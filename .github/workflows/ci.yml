name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: No high-severity npm advisories
        run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types (mypy strict)
        run: mypy
      - name: Tests (90% branch-coverage gate from pyproject.toml)
        run: python -m pytest -q --cov --cov-report=term-missing
      # Same gate as images.yml, but at PR time. Trivy reads only the direct pins in
      # requirements.txt (no lockfile); transitive packages are covered after merge by the
      # image scan in images.yml.
      - name: No fixable HIGH/CRITICAL in the backend's pinned dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ github.workspace }}/backend   # absolute: independent of the job's working-directory
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install pyyaml==6.0.2
      - name: Compose invariants (targets, image tags, names, agent view, ports, proxy pin + :ro)
        run: python scripts/check-compose.py
      - name: Compose files are valid
        run: |
          for f in docker-compose.yml deploy/dev/compose.yml deploy/stage/compose.yml $(ls compose.local.yml 2>/dev/null); do
            echo "== $f"; docker compose -f "$f" config --quiet
          done

  # The proxy runs a public nginx image pinned by digest in docker-compose.yml (Dependabot
  # proposes new digests). Fails on a fixable HIGH/CRITICAL CVE in that exact image: the fix is
  # to merge Dependabot's bump (or pin a fresh digest by hand), then recreate the proxy.
  proxy-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned proxy image from docker-compose.yml
        id: ref
        run: |
          image=$(awk '/^  proxy:/{p=1} p&&/^    image:/{print $2; exit}' docker-compose.yml)
          case "$image" in
            *@sha256:*) echo "image=$image" >> "$GITHUB_OUTPUT"; echo "Scanning $image" ;;
            *) echo "::error::the proxy image '$image' is not pinned by digest"; exit 1 ;;
          esac
      - name: No fixable HIGH/CRITICAL in the pinned proxy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-proxy.txt
      - name: Scan summary
        if: ${{ !cancelled() && steps.ref.outputs.image != '' }}
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          { echo "### Trivy (proxy $IMAGE, fixable HIGH/CRITICAL)"; echo '```'; cat trivy-proxy.txt 2>/dev/null || echo "(no report)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  images:
    runs-on: ubuntu-24.04
    needs: [frontend, backend, guards]
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          target: runtime
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Build ${{ matrix.service }} dev stage (local-only; keeps it from rotting)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          target: dev
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
