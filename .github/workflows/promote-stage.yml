name: Promote to stage

# Optional. Stage already follows master: images.yml moves :stage to the newest built
# master head. A vX.Y.Z-rc.N tag on an older master commit whose CI passed pins :stage
# to that commit's scanned sha-<commit> images (nothing is rebuilt) until the next
# master build. The deploy agent on the server picks up the moved tag within a minute.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: promote-stage
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      rc: ${{ steps.c.outputs.rc }}
    steps:
      - id: c
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then echo "rc=true" >> "$GITHUB_OUTPUT"
          else echo "rc=false" >> "$GITHUB_OUTPUT"; echo "$TAG is not an rc tag; nothing to do here."; fi

  verify:
    # No lock here: the waits below can take minutes and must not hold up master's stage retags.
    needs: classify
    if: needs.classify.outputs.rc == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must point at a commit on master
        run: |
          git merge-base --is-ancestor "$SHA" origin/master \
            || { echo "::error::$SHA is not on master"; exit 1; }
      - name: Master CI must have succeeded for this exact commit
        run: |
          # CI runs are push-triggered, so their head_sha is the commit itself. (Images runs are
          # workflow_run-triggered and filed under master's tip, so they are never looked up.)
          check() {  # -> success|failure|pending
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=push&branch=master&per_page=50" \
              --jq "[.workflow_runs[] | select(.name == \"CI\")] | sort_by(.created_at) | last
                    | if . == null then \"pending\" elif .status != \"completed\" then \"pending\"
                      elif .conclusion == \"success\" then \"success\" else \"failure\" end"
          }
          for i in $(seq 1 60); do
            ci=$(check); echo "CI=$ci"
            [ "$ci" = failure ] && { echo "::error::CI failed for $SHA"; exit 1; }
            [ "$ci" = success ] && exit 0
            sleep 15
          done
          echo "::error::timed out waiting for CI on $SHA"; exit 1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Wait for both scanned sha-<commit> images
        run: |
          # images.yml tags sha-<commit> only after the Trivy scan passed, so the tag is the proof.
          ref() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'; }
          for i in $(seq 1 60); do
            f=$(ref "ghcr.io/yuriioks/yuriodev-frontend:sha-$SHA") || f=""
            b=$(ref "ghcr.io/yuriioks/yuriodev-backend:sha-$SHA") || b=""
            [ -n "$f" ] && [ -n "$b" ] && exit 0
            echo "waiting for scanned images of $SHA (frontend=${f:-none} backend=${b:-none})"; sleep 15
          done
          echo "::error::no scanned sha-$SHA images (build failed or not finished)"; exit 1

  promote:
    needs: verify
    runs-on: ubuntu-24.04
    # Short, and shares the lock with images.yml's :stage retag so the two writers never interleave.
    concurrency:
      group: retag-stage
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point :stage at sha-<commit>
        run: |
          set -euo pipefail
          declare -A dig
          for svc in frontend backend; do
            img="ghcr.io/yuriioks/yuriodev-$svc"
            d=$(docker buildx imagetools inspect "$img:sha-$SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')
            [ -n "$d" ] || { echo "::error::$img:sha-$SHA not found"; exit 1; }
            dig[$svc]=$d
          done
          for svc in frontend backend; do
            img="ghcr.io/yuriioks/yuriodev-$svc"
            docker buildx imagetools create --prefer-index=false --tag "$img:stage" "$img@${dig[$svc]}"
            echo "### $svc: \`:stage\` -> \`${dig[$svc]}\` ($GITHUB_REF_NAME, sha-$SHA)" >> "$GITHUB_STEP_SUMMARY"
          done
