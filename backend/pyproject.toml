# Tool configuration only: the backend is not an installable package.

[tool.ruff]
target-version = "py311"  # the image runs Python 3.11
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, S bandit, ASYNC blocking calls
# in async code, DTZ naive datetimes, PT pytest style, SIM simplify, RUF ruff, T20 no print(),
# LOG/G logging calls.
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "DTZ", "PT", "SIM", "RUF", "T20", "LOG", "G"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Coverage is opt-in (CI passes `--cov`), so a subset run is not failed by the 90% gate.
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    # starlette 1.x nudges TestClient users towards httpx2; httpx stays until that is settled.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 90
# Protocol method bodies and type-checking-only imports never run.
exclude_also = ["^\\s*\\.\\.\\.$", "if TYPE_CHECKING:"]
show_missing = true
skip_covered = true
