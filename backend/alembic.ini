# Alembic for the dashboards schema. The app runs `alembic upgrade head` itself at startup
# (src/dashboards/db.py), so this file only serves the `alembic` command in a dev shell, from
# backend/ with DATABASE_URL set:  docker compose run --rm app alembic revision -m "..."
# env.py reads the URL from DATABASE_URL (it is a secret: never write it here).
[alembic]
script_location = src/dashboards/migrations
prepend_sys_path = .
